<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Wedding Wardrobe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Design your wedding gown and suit together, screen by screen, with every style from bridal history.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M22 56 L29 26 L25 13 L39 13 L35 26 L42 56 Z' fill='%23D8B262'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
/* Black-and-gold atelier app. Layout: bottom tab bar on phones, sidebar on desktop; builder screens pair a sticky figure with tile grids. */
:root{
  --bg:#000000; --surface:#0C0B0D; --raised:#151316; --ink:#F3EFEA; --muted:#9F978F; --faint:#5E5852; --line:#24211F;
  --stage:#111012; --gold:#D8B262; --gold-2:#B8913F; --gold-soft:#2A2212; --gold-ink:#F2DCA8; --ok:#9CC59A; --warn:#E89C7E; --warn-soft:#2E1A15;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabh:64px; --r:18px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
.tab,.srow,.journey,.btn,.brand{text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}

/* shell */
.app{min-height:100vh;display:flex}
.side{display:none}
main{flex:1;min-width:0;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);padding:6px 0;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--gold)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:20px;font-style:italic;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.iconbtn:hover{border-color:var(--gold-2)}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:flex;gap:3px;padding-bottom:10px}
.bar button{flex:1;height:4px;border-radius:2px;background:var(--line)}
.bar button.done{background:var(--gold-2)}
.bar button.on{background:var(--gold)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--gold-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#140F08}
.btn.gold:hover{background:#E4C37A}
.btn.ghost{background:none}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-size:22px;margin-bottom:4px}
.card h3{font-size:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}

/* welcome */
.welcome{min-height:100vh;display:flex;align-items:center;padding-block:40px}
.welcome .inner{max-width:520px;margin:0 auto;width:100%}
.mono{width:84px;height:84px;border-radius:50%;border:1px solid var(--gold-2);display:flex;align-items:center;justify-content:center;white-space:nowrap;font-family:var(--display);font-style:italic;font-size:30px;color:var(--gold);margin-bottom:20px}
.welcome h1{font-size:clamp(36px,9vw,52px);font-style:italic;line-height:1.02;margin:8px 0 12px}
.welcome p{color:var(--muted);margin:0 0 26px;max-width:46ch}
.fields{display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label,.flabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=text],input[type=date]{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--raised);font-size:16px}
input:focus{border-color:var(--gold-2);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.steps-dots{display:flex;gap:6px;margin-bottom:22px}
.steps-dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.steps-dots i.on{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink);font-weight:600}

/* home */
.hello{padding-top:26px;display:flex;align-items:center;gap:14px}
.hello .mono{width:56px;height:56px;font-size:20px;margin:0}
.hello h1{font-size:clamp(26px,6vw,34px);font-style:italic;line-height:1.1}
.hero{margin-top:20px;border-radius:24px;background:var(--stage);border:1px solid var(--line);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr)}
.hero .pair{height:330px}
.hero .meta{padding:18px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.big{font-family:var(--display);font-size:46px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.pair{display:flex;justify-content:center;align-items:flex-end;padding-top:14px}
.pair svg{height:100%;width:auto;max-width:50%}
.pair svg+svg{margin-left:-7%}
.sect{margin-top:30px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sect-h h2{font-size:24px}
.journeys{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.journey{display:flex;gap:14px;align-items:center;text-decoration:none}
.journey .thumb{width:78px;height:104px;border-radius:14px;background:var(--stage);flex:none;display:grid;place-items:center;overflow:hidden}
.journey .thumb svg{height:100%;width:auto}
.journey h3{font-size:19px;margin-bottom:2px}
.ring{--p:0;width:100%;height:5px;border-radius:3px;background:var(--line);margin:10px 0 6px;overflow:hidden}
.ring i{display:block;height:100%;width:calc(var(--p)*1%);background:var(--gold);border-radius:3px}
.wx-mini{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wx-temp{font-family:var(--display);font-size:44px;line-height:1;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.check-item{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.check-item:last-child{border-bottom:0}
.tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center;margin-top:1px}
.tick[aria-checked="true"]{background:var(--gold);border-color:var(--gold);color:#140F08}
.check-item .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.check-item.done .what{color:var(--muted);text-decoration:line-through}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);margin-left:6px}

/* builder */
.builder{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,96px));z-index:10;background:var(--bg);padding-block:10px 6px}
.stage-card{background:var(--stage);border:1px solid var(--line);border-radius:22px;height:26svh;min-height:170px;display:flex;justify-content:center;position:relative;overflow:hidden}
.stage-card svg{height:100%;width:auto;max-width:100%}
.viewtoggle{position:absolute;right:10px;top:10px;display:flex;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:999px;padding:3px}
.viewtoggle button{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;color:var(--muted)}
.viewtoggle button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-ink)}
.opts{padding-top:14px;display:flex;flex-direction:column;gap:26px;min-width:0}
.q h2{font-size:clamp(24px,5vw,30px);font-style:italic}
.note{margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--raised);border:1px solid var(--line);font-size:14px;color:var(--ink);display:flex;gap:10px}
.note b{color:var(--gold-ink);font-weight:600}
.glabel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--surface);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--faint)}
.tile:active{transform:scale(.98)}
.tile .pic{aspect-ratio:4/5;background:var(--stage);display:grid;place-items:center;overflow:hidden}
.tile .pic svg{width:100%;height:100%;display:block}
.tile .lbl{padding:9px 11px 11px;font-size:13.5px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:6px}
.tile .sw{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25)}
.tile[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.tile[aria-pressed="true"] .lbl{color:var(--gold-ink)}
.tile .mark{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#140F08;display:none;place-items:center}
.tile[aria-pressed="true"] .mark{display:grid}
.tile .rec{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.65);color:var(--gold);border:1px solid var(--gold-2)}
.era .pic{aspect-ratio:3/4}
.era .yr{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.era .lbl{flex-direction:column;align-items:flex-start;gap:2px}
.era .desc{font-weight:400;font-size:12.5px;color:var(--muted)}
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:35;background:linear-gradient(transparent,rgba(0,0,0,.95) 30%);padding:18px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.actionbar .in{max-width:1160px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.actionbar .btn{flex:1;max-width:260px}
.actionbar .btn.gold{flex:2;max-width:none}
.pad-bottom{height:90px}

/* review */
.review{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-top:16px}
.views{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.views .stage-card{height:auto;aspect-ratio:3/4;min-height:0}
.summary{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.srow:last-child{border-bottom:0}
.srow span{color:var(--muted);font-size:13px}
.srow b{font-weight:600;font-size:14px}
.srow .ico{color:var(--faint);width:16px;height:16px}
.checks{display:flex;flex-direction:column;gap:10px;font-size:14px}
.ck{display:flex;gap:10px;align-items:flex-start}
.ck .m{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--gold-soft);color:var(--gold-ink)}
.ck .m.w{background:var(--warn-soft);color:var(--warn)}
textarea{width:100%;min-height:200px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#000;color:var(--ink);font:13.5px/1.6 var(--body);resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;background:var(--raised);border:1px solid var(--gold-2);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* lookbook */
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.look{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.look .pic{height:190px;background:var(--stage);display:flex;justify-content:center;align-items:flex-end}
.look .pic svg{height:100%;width:auto;max-width:100%}
.look .pic.pairpic svg{max-width:52%}
.look .pic.pairpic svg+svg{margin-left:-8%}
.look .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.look .meta b{font-size:14px}
.look .meta span{font-size:12px;color:var(--muted)}
.look .acts{display:flex;border-top:1px solid var(--line)}
.look .acts button{flex:1;padding:10px;font-size:13px;font-weight:600;color:var(--gold)}
.look .acts button+button{border-left:1px solid var(--line);color:var(--muted)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}

@media (min-width:720px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .hero .pair{height:400px}
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1000px){
  .tabs{display:none}
  main{padding-bottom:40px}
  .side{display:flex;flex-direction:column;gap:6px;width:240px;flex:none;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:26px 16px;background:var(--bg)}
  .side .brand{font-family:var(--display);font-style:italic;font-size:22px;padding:0 10px 22px;text-decoration:none}
  .side .brand b{color:var(--gold);font-weight:500}
  .side .tab{flex-direction:row;font-size:14.5px;gap:12px;padding:11px 12px;color:var(--muted)}
  .side .tab[aria-current="page"]{background:var(--gold-soft);color:var(--gold-ink)}
  .side .foot{margin-top:auto;font-size:12px;color:var(--faint);padding:0 10px}
  .builder{grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:32px;align-items:start}
  .stage{top:calc(var(--toph,96px) + 16px);padding-block:16px 0}
  .stage-card{height:min(70vh,640px)}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .actionbar{left:240px;bottom:0;padding-bottom:18px}
  .review{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .toast{bottom:100px}
}
@media (min-width:1300px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .3s ease}@keyframes in{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div class="app" id="app">
  <nav class="side" id="side" aria-label="Main"></nav>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= Figures: gown (front + back) and suit ================= */
const GOLD='#C49A3C', GOLD_D='#94701F';
const f1=v=>(+v).toFixed(1);
function interp(t,y){if(y<=t[0][0])return t[0][1];for(let i=1;i<t.length;i++){if(y<=t[i][0]){const a=t[i-1],b=t[i];return a[1]+(b[1]-a[1])*(y-a[0])/(b[0]-a[0]);}}return t[t.length-1][1];}
const wd=(d,f)=>d.replace(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g,(_,x,y)=>{const r=f(+x,+y);return f1(r[0])+' '+f1(r[1]);});
const ws=(str,f)=>str.replace(/ d="([^"]*)"/g,(_,d)=>' d="'+wd(d,f)+'"').replace(/cx="(-?[\d.]+)" cy="(-?[\d.]+)"/g,(_,x,y)=>{const r=f(+x,+y);return 'cx="'+f1(r[0])+'" cy="'+f1(r[1])+'"';});
const mx=x=>360-x;
const pts=a=>a.map((p,i)=>(i?'L':'M')+f1(p[0])+' '+f1(p[1])).join(' ');
const mir=a=>a.map(p=>[mx(p[0]),p[1]]);
const mirD=d=>wd(d,(x,y)=>[mx(x),y]);
const tint=(hex,amt)=>{let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.round(amt<0?v*(1+amt):v+(255-v)*amt);return '#'+[f(r),f(g),f(b)].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');};
const lum=hex=>{const n=parseInt(hex.slice(1),16);return ((n>>16)*.299+(n>>8&255)*.587+(n&255)*.114)/255;};
function smooth(p){let d='';for(let i=1;i<p.length-1;i++){const a=p[i],b=p[i+1];d+=` Q ${f1(a[0])} ${f1(a[1])} ${f1((a[0]+b[0])/2)} ${f1((a[1]+b[1])/2)}`;}const l=p[p.length-1];return d+` L ${f1(l[0])} ${f1(l[1])}`;}
function xAt(a,y){for(let i=1;i<a.length;i++){if(a[i][1]>=y||i===a.length-1){const p=a[i-1],q=a[i],t=(y-p[1])/((q[1]-p[1])||1);return p[0]+(q[0]-p[0])*Math.max(-.2,Math.min(1.2,t));}}return a[0][0];}
/* a limb band between an outer and inner guide line, y0..y1, widened by grow (number or fn of y) */
function limb(outer,inner,y0,y1,grow,side){
  const g=typeof grow==='function'?grow:()=>grow, n=Math.max(2,Math.ceil((y1-y0)/7)), ys=[];
  for(let i=0;i<=n;i++)ys.push(y0+(y1-y0)*i/n);

  for(const k in DEF){
    if(!opts[k])continue;
    if(Array.isArray(DEF[k])) obj[k]=(Array.isArray(obj[k])?obj[k]:clone(DEF[k])).filter(id=>opts[k].some(o=>o.id===id));
    else if(!opts[k].some(o=>o.id===obj[k])) obj[k]=DEF[k];
  }
  return obj;
}

function applyRules(kind,S,key,id,announce){
  const say=m=>{if(announce)toast(m);};
  if(kind==='gown'){
    if(key==='sleeves'&&['spaghetti','tank'].includes(id)&&!['sweetheart','straight'].includes(S.neckline)){S.neckline='straight';say('Neckline set to straight strapless so the straps show');}
    if(key==='neckline'&&['spaghetti','tank'].includes(S.sleeves)&&!['sweetheart','straight'].includes(id)){S.sleeves='none';say('Straps removed; this neckline has its own');}
    if(key==='silhouette'&&id==='empire')S.waist='empire';
    if(key==='silhouette'&&id==='dropwaist')S.waist='dropped';
    if(key==='silhouette'&&!['empire','dropwaist'].includes(id)&&['empire','dropped'].includes(S.waist)&&announce)S.waist='natural';
    if(key==='silhouette'&&['tealength','highlow'].includes(id)&&S.train!=='none'){S.train='none';say('Train removed for this length');}
  }
  if(kind==='suit'){
    if(key==='style'&&['bandhgala','sherwani'].includes(id)&&!['none'].includes(S.neckwear)){S.neckwear='none';}
    if(key==='style'&&id==='morning'&&S.trousers==='match')S.trousers='grey';

}

const CLIMATES={hot:{label:'Hot and humid',cold:false},dry:{label:'Warm and dry',cold:false},mild:{label:'Mild',cold:false},cold:{label:'Cold',cold:true}};
function comfort(kind){
  const S=ST[kind], C=CLIMATES[ST.profile.climate]||CLIMATES.mild;
  let v;
  if(kind==='gown'){
    let f={chiffon:5,georgette:5,organza:4,tulle:3,crepe:4,satin:2,charmeuse:3,mikado:2,taffeta:2,lace:3,velvet:1,brocade:1,sequin:2}[S.fabric];
    const si={sheath:5,slip:5,empire:5,tealength:5,highlow:4,jumpsuit:4,aline:4,princess:4,fitflare:3,trumpet:3,mermaid:3,dropwaist:4,ball:1}[S.silhouette];
    let sl={none:5,spaghetti:5,tank:5,cap:4,short:4,flutter:5,puff:3,threequarter:3,long:3,bishop:2,bell:3,juliet:2,offband:4,cape:3,bolero:4}[S.sleeves];
    const t={none:5,sweep:4,court:4,chapel:3,cathedral:2,royal:1,watteau:2,detachable:4}[S.train];
    if(C.cold){f=6-f;sl=6-sl;} v=f*.4+si*.3+sl*.15+t*.15;
  } else {
    let f={linen:5,tropical:4,silkcotton:4,silk:3,tweed:1,brocade:2,velvet:1}[S.fabric];
    const st={suit:4,dinner:4,tux:3,bandhgala:4,threepiece:2,morning:2,sherwani:2}[S.style];
    if(C.cold)f=6-f; v=f*.5+(C.cold&&['threepiece','sherwani','morning'].includes(S.style)?5:st)*.35+(S.neckwear==='none'?5:4)*.15;
  }
  if(ST.profile.climate==='mild')v=(v+4.6)/2;
  const n=Math.max(1,Math.min(5,Math.round(v)));
  return {n,word:v>=4.2?'Very comfortable':v>=3.4?'Comfortable':v>=2.6?'Some compromise':C.cold?'Too cold':'Too warm'};
}
const ck=(ok,html,mark)=>`<div class="ck"><span class="m${ok?'':' w'}" aria-hidden="true">${mark||(ok?'✓':'!')}</span><div>${html}</div></div>`;

function gownChecks(){const g=ST.gown;const cov=['cap','short','flutter','puff','threequarter','long','bishop','bell','juliet','cape','bolero'].includes(g.sleeves)||['illusion','queenanne','highneck','jewel'].includes(g.neckline);

function coordination(){
  const G=ST.gown,U=ST.suit,r=[];
  const gGold=G.details.includes('kasavu')||G.details.includes('embroidery')||G.belt==='gold'||['gold','champagne'].includes(G.shade);
  const uGold=U.pocket==='kasavu'||U.details.includes('piping')||U.details.includes('goldbuttons')||U.accent==='gold'||U.color==='gold';
  if(gGold&&uGold)r.push({ok:true,text:'<b>Shared detail:</b> gold appears in both outfits and ties them together.'});
  else if(gGold)r.push({ok:false,text:'<b>Shared detail:</b> the gown has gold. A gold pocket square, piping or accent on the suit would echo it.'});
  else if(uGold)r.push({ok:false,text:'<b>Shared detail:</b> the suit has gold. A gold border or belt on the gown would link the two.'});
  else if(U.accent==='gown')r.push({ok:true,text:'<b>Shared detail:</b> the suit’s accent picks up the gown’s exact shade.'});
  else r.push({ok:false,text:'<b>Shared detail:</b> nothing links the outfits yet. Try gold on both, or set the suit accent to the gown shade.'});
  const light=SUITC[U.color].light, gl=lum(SHADES[G.shade].fill)>.75;
  if(['ivory','white','champagne'].includes(U.color)&&['white','diamond'].includes(G.shade)&&U.color!==G.shade)r.push({ok:false,text:'<b>Colour:</b> a warm light jacket beside a bright white gown can make the gown look grey in photos.'});
  else if(U.color===G.shade)r.push({ok:false,text:'<b>Colour:</b> both are the same shade. Add contrast with dark trousers, lapels or a bow tie.'});
  else if(!light||!gl)r.push({ok:true,text:`<b>Colour:</b> ${esc(S_OPTS.color.find(o=>o.id===U.color).label.toLowerCase())} frames the ${esc(G_OPTS.shade.find(o=>o.id===G.shade).label.toLowerCase())} gown well in photos.`});
  else r.push({ok:true,text:'<b>Colour:</b> light tones together look soft and romantic. Keep shoes or trousers darker for definition.'});
  const gF=({ball:2,mermaid:1,trumpet:1,princess:1}[G.silhouette]||0)+({cathedral:2,royal:3,chapel:1,watteau:2}[G.train]||0)+(['cathedral','royal'].includes(G.veil)?1:0)+(['satin','mikado','brocade','velvet','taffeta'].includes(G.fabric)?1:0)-(['jumpsuit','tealength','highlow','slip'].includes(G.silhouette)?1:0);
  const uF={tux:3,dinner:3,morning:3,sherwani:3,threepiece:2,bandhgala:2,suit:1}[U.style]+(U.neckwear!=='none'?1:0)-(U.fabric==='linen'?1:0)+(['velvet','brocade','silk'].includes(U.fabric)?1:0);
  if(gF>=4&&uF<=2)r.push({ok:false,text:'<b>Formality:</b> the gown is very formal. A tuxedo, sherwani or at least a tie would match it.'});
  else if(gF<=1&&uF>=4)r.push({ok:false,text:'<b>Formality:</b> the suit is dressier than the gown. A two-piece or open collar would sit better beside it.'});
  else r.push({ok:true,text:'<b>Formality:</b> both outfits sit at the same level of dressiness.'});
  if(G.era&&U.era){const ge=GOWN_ERAS.find(e=>e.id===G.era),ue=SUIT_ERAS.find(e=>e.id===U.era);if(ge&&ue&&ge.year===ue.year)r.push({ok:true,text:`<b>Era:</b> both are inspired by the ${esc(ge.year)}.`});}
  return r;
}

function gownSentence(g){
  const waist=g.silhouette==='empire'?'empire':g.silhouette==='dropwaist'?'dropped':g.waist;
  const parts=[`${an(PH.shade[g.shade])} wedding gown in ${PH.fabric[g.fabric]}, with ${PH.silhouette[g.silhouette]}, ${PH.neckline[g.neckline]} and ${PH.sleeves[g.sleeves]}.`];
  if(waist!=='natural')parts.push(`The waistline is ${{empire:'an empire waist just under the bust',dropped:'dropped to the hips',basque:'a pointed basque V'}[waist]}.`);
  if(g.details.length)parts.push('Details: '+and(g.details.map(d=>PH.details[d]))+'.');
  if(g.belt!=='none')parts.push('At the waist: '+lab('gown','belt',g.belt).toLowerCase()+'.');
  parts.push(`The back has ${an(lab('gown','back',g.back).toLowerCase())}.`);
  if(!['tealength','highlow'].includes(g.silhouette))parts.push(`It has ${PH.train[g.train]}.`);
  const acc=[];if(g.headpiece!=='none')acc.push(an(lab('gown','headpiece',g.headpiece).toLowerCase()));if(g.necklace!=='none')acc.push(an(lab('gown','necklace',g.necklace).toLowerCase()+' necklace').replace('necklace necklace','necklace'));
  if(g.earrings!=='none')acc.push(lab('gown','earrings',g.earrings).toLowerCase()+' earrings');if(g.gloves!=='none')acc.push(lab('gown','gloves',g.gloves).toLowerCase()+'-length gloves');
  parts.push(`Hair: ${lab('gown','haircolor',g.haircolor).toLowerCase()}, styled as ${an(lab('gown','hair',g.hair).toLowerCase())}, with ${PH.veil[g.veil]}${acc.length?', '+and(acc):''}.`);
  return parts.join(' ');

function suitSentence(u){

  const acc=u.accent==='gown'?PH.shade[ST.gown.shade]+' (matching the gown)':lab('suit','accent',u.accent).toLowerCase();
  const p=[{suit:`A tailored ${c} two-piece suit`,threepiece:`A tailored ${c} three-piece suit with a matching waistcoat`,tux:`A ${c} tuxedo with satin lapels and a satin trouser stripe`,dinner:`A ${c} dinner jacket`,morning:`A ${c} morning coat with tails over a dove-grey waistcoat`,bandhgala:`A ${c} bandhgala, a closed mandarin-collar Indian jacket with a row of buttons`,sherwani:`A ${c} knee-length sherwani with fitted churidar trousers`}[u.style]+` in ${lab('suit','fabric',u.fabric).toLowerCase()}.`];

function brief(kind){
  const steps=kind==='gown'?GOWN_STEPS:SUIT_STEPS, S=ST[kind], rows=[];
  steps.forEach(st=>st.groups.forEach(g=>{if(g.key==='era'||g.key==='skin'||g.key==='haircolor')return;if(offNote(kind,g.key))return;
    const v=Array.isArray(S[g.key])?(S[g.key].length?S[g.key].map(id=>lab(kind,g.key,id)).join(', '):'None'):lab(kind,g.key,S[g.key]);rows.push([g.label||st.title,v,st.id]);}));
  return rows;
}
function briefText(kind){const p=place(),W=weddingDate();return `${title(kind)} — design brief${p||W?` (${[p,W?fmtDate(W):''].filter(Boolean).join(', ')})`:''}\n`+brief(kind).map(([k,v])=>`${k}: ${v}`).join('\n');}

/* ---------- weather ---------- */
const cf=c=>`${Math.round(c)}°C / ${Math.round(c*9/5+32)}°F`;
async function lookupWeather(){
  const P=ST.profile, loc=P.location.trim();
  if(!loc){toast('Enter a location first');return;}
  if(!P.date){toast('Add your wedding date first');return;}
  const btn=$('wx-go'); if(btn){btn.disabled=true;btn.textContent='Looking up…';}
  let r=null,msg='';
  try{const res=await fetch('/api/weather?'+new URLSearchParams({q:loc,date:P.date,time:P.time,venue:P.venue}));
    const j=await res.json().catch(()=>null); if(res.ok&&j&&typeof j.day_high_c==='number')r=j; else if(j&&j.message)msg=j.message;}catch(e){}
  if(!r&&!msg&&window.claude&&window.claude.use){try{const sample=await window.claude.use('sample');if(sample){
    const j=await sample.json(`Using long-term climate averages (not a forecast), describe typical conditions for a wedding in ${loc} on ${fmtDate(weddingDate())} (${P.time}). Reply with only JSON: {"recognised":true,"place":"Town, Region, Country","climate":"hot|dry|mild|cold","season_note":"short label","day_high_c":0,"evening_c":0,"night_low_c":0,"humidity_pct":0,"rain_chance_pct":0,"sunset":"HH:MM","outfit_tips":["3 short tips"],"local_notes":["3 short local notes"]}. If the place is unknown reply {"recognised":false}.`,{cache:{gcTime:86400000}});
    if(j&&j.recognised!==false&&typeof j.day_high_c==='number')r=Object.assign({source:'estimate'},j); else msg='We couldn’t find that place. Try adding the country.';}}catch(e){}}
  if(btn){btn.disabled=false;btn.textContent='Get weather for my date';}
  if(!r){toast(msg||'Weather lookup isn’t available here. Choose a weather type instead.');return;}
  P.wx={place:String(r.place||loc),climate:CLIMATES[r.climate]?r.climate:'mild',season:String(r.season_note||''),day_high_c:r.day_high_c,evening_c:r.evening_c??r.day_high_c,night_low_c:r.night_low_c??r.evening_c,
    humidity_pct:r.humidity_pct||0,rain_chance_pct:r.rain_chance_pct||0,sunset:String(r.sunset||''),outfit_tips:(r.outfit_tips||[]).slice(0,3).map(String),local_notes:(r.local_notes||[]).slice(0,3).map(String),
    source:r.source||'climate',years:r.years||0,forLoc:loc,forDate:P.date,gown_fabric:r.gown_fabric,suit_fabric:r.suit_fabric};
  P.climate=P.wx.climate; save(); toast('Weather updated for '+P.wx.place); render();
}
function wxCard(full){
  const w=ST.profile.wx; if(!w)return '';
  const T=Math.round(ST.profile.time==='evening'?w.evening_c:w.day_high_c), W=weddingDate();
  const stat=(k,v)=>`<div class="stat"><span>${k}</span><b>${esc(v)}</b></div>`;
  const src=w.source==='forecast'?'Live forecast for your date.':w.source==='climate'?`Average of the last ${w.years||10} years around your date.`:'Typical conditions for the season.';
  return `<div class="card"><div class="wx-mini"><span class="wx-temp">${T}°C</span><div><div style="font-weight:600">${esc(w.place)}</div><div class="muted" style="font-size:13.5px">${esc(w.season||CLIMATES[w.climate].label)} · typical ${ST.profile.time==='evening'?'evening':'daytime'}${W?' around '+fmtDate(W):''}</div></div></div>
   <div class="stats">${stat('High',cf(w.day_high_c))}${stat('Evening',cf(w.evening_c))}${stat('Humidity',Math.round(w.humidity_pct)+'%')}${stat('Rain',Math.round(w.rain_chance_pct)+'%')}${w.sunset?stat('Sunset',w.sunset):''}</div>
   ${full&&(w.outfit_tips.length||w.local_notes.length)?`<div class="grid2" style="margin-top:16px"><div><h3 style="font-size:17px;margin-bottom:6px">For your outfits</h3><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px">${w.outfit_tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><div><h3 style="font-size:17px;margin-bottom:6px">Good to know</h3><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px">${w.local_notes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div>`:''}
   <p class="muted" style="font-size:12.5px;margin:12px 0 0">${src} Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>.</p></div>`;
}

function stepsOf(k){return k==='gown'?GOWN_STEPS:SUIT_STEPS;}
let VIEW='front';
function topbar(k,i,steps,label){
  return `<header class="top"><div class="wrap"><div class="top-in"><a class="iconbtn" href="#home" aria-label="Home">${icon('back')}</a><h1>${esc(title(k))}</h1><span class="count">${label||`${i+1} / ${steps.length}`}</span></div>
   <div class="bar">${steps.map((s,j)=>`<button data-go="${k}-${s.id}" class="${j===i?'on':ST.done[k][s.id]?'done':''}" aria-label="${esc(s.title)}"></button>`).join('')}<button data-go="${k}-review" class="${i===steps.length?'on':''}" aria-label="Review"></button></div></div></header>`;
}
function tilesHTML(k,step,g){
  const S=ST[k], opts=(k==='gown'?G_OPTS:S_OPTS)[g.key], rec=recs(k)[g.key]||[], off=offNote(k,g.key);
  return opts.map((o,i)=>{
    const sel=g.multi?S[g.key].includes(o.id):S[g.key]===o.id;
    const s=applyRules(k,Object.assign(clone(S),{[g.key]:g.multi?[o.id]:o.id}),g.key,o.id,false);
    const svg=g.back?renderGownBack(s,`t${g.key}${i}`):fig(k,s,`t${g.key}${i}`);
    const sw=g.swatch?`<span class="sw" style="background:${g.swatch(o.id)}"></span>`:'';
    return `<button class="tile" data-pick="${k}|${g.key}|${o.id}" aria-pressed="${sel}"${off?' style="opacity:.45"':''}><div class="pic">${g.back?svg:crop(svg,g.crop)}</div><div class="lbl">${sw}${esc(o.label)}</div>${rec.includes(o.id)?'<span class="rec">✦ Flatters</span>':''}<span class="mark">${icon('check','ico')}</span></button>`;
  }).join('');
}
function groupNote(k,g){
  const S=ST[k], off=offNote(k,g.key); if(off)return `<div class="note">${icon('spark')}<div>${esc(off)}</div></div>`;
  const opts=(k==='gown'?G_OPTS:S_OPTS)[g.key];
  if(g.multi){const sel=S[g.key].map(id=>opts.find(o=>o.id===id)).filter(Boolean);return `<div class="note">${icon('spark')}<div>${sel.length?sel.map(o=>`<b>${esc(o.label)}.</b> ${esc(o.note)}`).join(' '):'No embellishments yet. Clean and minimal.'}</div></div>`;}
  const o=opts.find(x=>x.id===S[g.key]); if(!o||!o.note)return '';
  return `<div class="note">${icon('spark')}<div><b>${esc(o.label)}.</b> ${esc(o.note)}</div></div>`;
}
function builder(k,stepId){

  const backView=k==='gown'&&(st.id==='back'||VIEW==='back');
  const preview=k==='gown'?(backView?renderGownBack(S,'m'):crop(renderGown(S,'m'),'40 0 340 545')):crop(renderSuit(S,'m',ST.gown.shade),'92 8 176 512');
  let opts;
  if(st.era){const ERAS=k==='gown'?GOWN_ERAS:SUIT_ERAS, cur=ERAS.find(e=>e.id===S.era);
    opts=`<div class="q"><h2>${esc(st.q)}</h2>${cur?`<div class="note">${icon('spark')}<div><b>${esc(cur.label)} (${esc(cur.year)}).</b> ${esc(cur.note)} Every choice is still yours to change.</div></div>`:`<p class="muted" style="margin:8px 0 0">Pick an era to start from its signature look, or skip and build from scratch.</p>`}</div>
      <div class="tiles">${ERAS.map((e,j)=>`<button class="tile era" data-era="${k}|${e.id}" aria-pressed="${S.era===e.id}"><div class="pic">${crop(fig(k,Object.assign({},S,e.p),'e'+j),k==='gown'?'40 0 340 545':'92 0 176 520')}</div><div class="lbl"><span class="yr">${esc(e.year)}</span>${esc(e.label)}<span class="desc">${esc(e.note)}</span></div><span class="mark">${icon('check','ico')}</span></button>`).join('')}</div>`;}
  else opts=`<div class="q"><h2>${esc(st.q)}</h2></div>`+st.groups.map(g=>`<section aria-label="${esc(g.label||st.title)}">${st.groups.length>1?`<div class="glabel"><span class="flabel">${esc(g.label)}</span>${g.multi?'<span class="muted" style="font-size:12px">Choose any</span>':''}</div>`:''}<div id="note-${g.key}">${groupNote(k,g)}</div><div class="tiles" id="tiles-${g.key}" style="margin-top:12px">${tilesHTML(k,st,g)}</div></section>`).join('');
  const prev=i>0?`${k}-${steps[i-1].id}`:'home', next=i<steps.length-1?`${k}-${steps[i+1].id}`:`${k}-review`;
  return topbar(k,i,steps)+`<section class="screen"><div class="wrap"><div class="builder">
    <div class="stage"><div class="stage-card" id="stage">${preview}${k==='gown'?`<div class="viewtoggle"><button data-view="front" aria-pressed="${!backView}">Front</button><button data-view="back" aria-pressed="${backView}">Back</button></div>`:''}</div></div>
    <div class="opts">${opts}<div class="pad-bottom"></div></div></div></div></section>
    <div class="actionbar"><div class="in"><a class="btn" href="#${prev}">${icon('back')} ${i>0?'Back':'Home'}</a><a class="btn gold" href="#${next}" data-done="${k}|${st.id}">${st.era&&!S.era?'Skip':'Next'}: ${i<steps.length-1?esc(steps[i+1].title):'Review'} ${icon('next')}</a></div></div>`;
}
function refreshBuilder(k,stepId,changedKey){
  const st=stepsOf(k).find(s=>s.id===stepId), S=ST[k];
  const backView=k==='gown'&&(st.id==='back'||VIEW==='back');
  const preview=k==='gown'?(backView?renderGownBack(S,'m'):crop(renderGown(S,'m'),'40 0 340 545')):crop(renderSuit(S,'m',ST.gown.shade),'92 8 176 512');
  const stage=$('stage');if(stage){const tg=stage.querySelector('.viewtoggle');stage.innerHTML=preview;if(tg)stage.appendChild(tg);}
  st.groups.forEach(g=>{
    const n=$('note-'+g.key);if(n)n.innerHTML=groupNote(k,g);
    const t=$('tiles-'+g.key);if(!t)return;
    if(g.key===changedKey&&!g.multi){t.querySelectorAll('.tile').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pick.split('|')[2]===S[g.key]));}
    else if(g.key===changedKey&&g.multi){t.querySelectorAll('.tile').forEach(b=>b.setAttribute('aria-pressed',S[g.key].includes(b.dataset.pick.split('|')[2])));}
    else t.innerHTML=tilesHTML(k,st,g);
  });
}

    <div class="row"><a class="btn" href="#gown-review">${icon('gown')} Edit gown</a><a class="btn" href="#suit-review">${icon('suit')} Edit suit</a><button class="btn gold" data-save="pair">${icon('save')} Save pair</button></div></div>
   <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <div class="card"><h2>How well they match</h2><p style="margin:2px 0 12px"><span class="tag" style="margin:0">${good} of ${c.length} looking good</span></p><div class="checks">${c.map(x=>ck(x.ok,x.text)).join('')}</div></div>
    <div class="card"><h2>Couple image prompt</h2><p class="muted" style="margin:0 0 12px;font-size:14px">Attach two full-length photos, first the person in the gown, then the person in the suit.</p>
     <div class="chips">${Object.entries(SETTINGS).map(([id,v])=>`<button class="chip" data-setting="${id}" aria-pressed="${ST.setting===id}">${v.label}</button>`).join('')}</div>
     <textarea id="prompt-pair" readonly aria-label="Couple image prompt" style="margin:12px 0">${esc(prompt('pair'))}</textarea><button class="btn gold" data-copyprompt="pair">${icon('copy')} Copy prompt</button></div>
   </div></div></div></section>`;
}

let DEL=-1;
function lookbook(){
  const L=ST.looks;
  return `<header class="top"><div class="wrap"><div class="top-in"><a class="iconbtn" href="#home" aria-label="Home">${icon('back')}</a><h1>Lookbook</h1><span class="count">${L.length} saved</span></div></div></header>
  <section class="screen"><div class="wrap" style="padding-top:18px">${L.length?`<div class="looks">${L.map((l,i)=>`<div class="look"><div class="pic${l.kind==='pair'?' pairpic':''}">${l.kind==='pair'?crop(renderGown(l.gown,'lg'+i),'40 0 340 545')+crop(renderSuit(l.suit,'ls'+i,l.gown.shade),'40 0 300 545'):l.kind==='gown'?crop(renderGown(l.gown,'lg'+i),'40 0 340 545'):crop(renderSuit(l.suit,'ls'+i,ST.gown.shade),'92 8 176 512')}</div>
     <div class="meta"><b>${esc(l.name)}</b><span>${l.kind==='pair'?'Gown and suit':l.kind==='gown'?'Gown':'Suit'} · ${new Date(l.at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></div>
     <div class="acts"><button data-load="${i}">Open</button><button data-del="${i}">${DEL===i?'Tap to delete':'Delete'}</button></div></div>`).join('')}</div>`
   :`<div class="card empty"><h3>No saved looks yet</h3><p>Finish a design and tap Save on the review screen. Your looks appear here so you can compare them.</p><div class="row" style="justify-content:center;margin-top:14px"><a class="btn gold" href="#gown">${icon('gown')} Design the gown</a><a class="btn" href="#suit">${icon('suit')} Design the suit</a></div></div>`}</div></section>`;
}

let RESET=false;
function wedding(){
  const P=ST.profile;
  return `<header class="top"><div class="wrap"><div class="top-in"><a class="iconbtn" href="#home" aria-label="Home">${icon('back')}</a><h1>Your wedding</h1></div></div></header>
  <section class="screen"><div class="wrap" style="padding-top:18px;display:flex;flex-direction:column;gap:14px;max-width:760px">
   <div class="card"><h2>The couple</h2><div class="grid2" style="margin-top:10px"><div class="field"><label for="w-g">Wearing the gown</label><input type="text" id="w-g" value="${esc(P.gownName)}" placeholder="First name" data-field="gownName"></div><div class="field"><label for="w-s">Wearing the suit</label><input type="text" id="w-s" value="${esc(P.suitName)}" placeholder="First name" data-field="suitName"></div></div></div>
   <div class="card"><h2>Date and place</h2><div class="grid2" style="margin-top:10px"><div class="field"><label for="w-d">Wedding date</label><input type="date" id="w-d" value="${esc(P.date)}" data-field="date"></div><div class="field"><label for="w-l">Location</label><input type="text" id="w-l" value="${esc(P.location)}" placeholder="City or venue, e.g. Kochi, India" data-field="location"></div></div>
    <div class="grid2" style="margin-top:14px"><div class="field"><span class="flabel">Time of day</span><div class="chips">${['day','evening'].map(t=>`<button class="chip" data-prof="time:${t}" aria-pressed="${P.time===t}">${t==='day'?'Daytime':'Evening'}</button>`).join('')}</div></div>
    <div class="field"><span class="flabel">Venue</span><div class="chips">${[['indoor','Indoor'],['outdoor','Outdoor'],['mixed','Both']].map(([v,l])=>`<button class="chip" data-prof="venue:${v}" aria-pressed="${P.venue===v}">${l}</button>`).join('')}</div></div></div>
    <div class="row" style="margin-top:18px"><button class="btn gold" id="wx-go" data-wx>Get weather for my date</button></div></div>
   ${P.wx?wxCard(true):''}
   <div class="card"><h2>Weather type</h2><p class="muted" style="margin:0 0 12px;font-size:14px">Used for comfort checks. The weather lookup sets this for you.</p><div class="chips">${Object.entries(CLIMATES).map(([id,v])=>`<button class="chip" data-prof="climate:${id}" aria-pressed="${P.climate===id}">${v.label}</button>`).join('')}</div></div>
   <div class="card"><h2>Start over</h2><p class="muted" style="margin:0 0 12px;font-size:14px">Clears both designs and your progress. Saved looks and wedding details stay.</p><button class="btn" data-reset>${RESET?'Tap again to confirm':'Reset designs'}</button></div>
   <p class="muted" style="font-size:12.5px">Everything is saved only in this browser on this device.</p>
  </div></section>`;
}

/* ================= router ================= */
let CUR='';
function nav(cur){
  const sec=cur.split('-')[0];
  const items=NAV.map(([id,l,ic])=>`<a class="tab" href="#${id}" ${sec===id?'aria-current="page"':''}>${icon(ic)}<span>${l}</span></a>`).join('');
  $('tabs').innerHTML=items;
  $('side').innerHTML=`<a class="brand" href="#home">The Wedding <b>Wardrobe</b></a>${items}<a class="tab" href="#wedding" ${sec==='wedding'?'aria-current="page"':''}>${icon('gear')}<span>Your wedding</span></a><div class="foot">${couple()?esc(couple())+'<br>':''}${weddingDate()?fmtDate(weddingDate()):''}</div>`;
  $('tabs').classList.toggle('hidden',sec==='welcome');$('side').classList.toggle('hidden',sec==='welcome');
}
function resolve(h){
  if(!h)return ST.onboarded?'home':'welcome';
  if(h==='gown'||h==='suit'){const steps=stepsOf(h);const last=ST.last[h];if(last&&steps.some(s=>s.id===last))return h+'-'+last;const nd=steps.find(s=>!ST.done[h][s.id]);return nd?h+'-'+nd.id:h+'-review';}
  return h;
}
function render(keepScroll){
  const h=resolve(location.hash.slice(1)), [sec,...rest]=h.split('-'), sub=rest.join('-');
  const y=window.scrollY;
  let html;
  if(sec==='welcome')html=welcome();
  else if(sec==='gown'||sec==='suit')html=sub==='review'?review(sec):builder(sec,sub);
  else if(sec==='together')html=together();
  else if(sec==='lookbook')html=lookbook();
  else if(sec==='wedding')html=wedding();
  else html=home();
  $('main').innerHTML=html; nav(h);
  const top=document.querySelector('.top'); document.documentElement.style.setProperty('--toph',(top?top.offsetHeight:0)+'px');
  if(keepScroll)window.scrollTo(0,y); else if(CUR!==h)window.scrollTo(0,0);
  CUR=h;
}
window.addEventListener('hashchange',()=>{DEL=-1;RESET=false;render();});
window.addEventListener('resize',()=>{const top=document.querySelector('.top');document.documentElement.style.setProperty('--toph',(top?top.offsetHeight:0)+'px');});

/* ================= events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t)return;
  const d=t.dataset;
  if(d.go){location.hash=d.go;return;}
  if(d.pick){const [k,key,id]=d.pick.split('|'), step=CUR.split('-').slice(1).join('-'), stObj=stepsOf(k).find(s=>s.id===step), g=stObj&&stObj.groups.find(x=>x.key===key);
    const S=ST[k]; const before=JSON.stringify(S);
    if(g&&g.multi){const set=new Set(S[key]);set.has(id)?set.delete(id):set.add(id);S[key]=[...set];}else S[key]=id;
    applyRules(k,S,key,id,true); ST.done[k][step]=true; save();
    const crossChanged=Object.keys(S).some(x=>x!==key&&JSON.stringify(S[x])!==JSON.stringify(JSON.parse(before)[x]));
    if(crossChanged)render(true); else refreshBuilder(k,step,key); return;}
  if(d.era){const [k,id]=d.era.split('|'), ERAS=k==='gown'?GOWN_ERAS:SUIT_ERAS, e2=ERAS.find(x=>x.id===id);
    Object.assign(ST[k],clone(e2.p),{era:id}); ST.done[k].era=true; save(); toast(`${e2.label} look applied`);
    if(CUR.startsWith(k+'-'))render(true); else location.hash=k+'-era'; return;}
  if(d.done){const [k,id]=d.done.split('|');ST.done[k][id]=true;save();return;}
  if(d.view){VIEW=d.view;const step=CUR.split('-').slice(1).join('-');refreshBuilder('gown',step,null);return;}
  if(d.ob){
    if(d.ob==='next'){obSave();OB=Math.min(2,OB+1);render();return;}
    if(d.ob==='back'){obSave();OB=Math.max(0,OB-1);render();return;}
    obSave();ST.onboarded=true;save();
    if(d.ob==='skip'||d.ob==='home'){location.hash='home';render();return;}
    location.hash=d.ob+'-era';return;}
  if(d.prof){obSave();wedSave();const [k,v]=d.prof.split(':');ST.profile[k]=v;save();render(true);return;}
  if(d.check!==undefined){ST.checks[d.check]=!ST.checks[d.check];save();render(true);return;}
  if(d.setting){ST.setting=d.setting;save();document.querySelectorAll('[data-setting]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.setting===ST.setting));
    ['gown','suit','pair'].forEach(k=>{const ta=$('prompt-'+k);if(ta)ta.value=prompt(k);});return;}
  if(d.copybrief){copyText(briefText(d.copybrief),'Brief');return;}
  if(d.copyprompt){const ta=$('prompt-'+d.copyprompt);copyText(ta.value,'Prompt');try{ta.select();}catch(_){}return;}
  if(d.save){const k=d.save, inp=$('look-name'), name=(inp&&inp.value.trim())||(k==='pair'?(couple()||'Our')+' look '+(ST.looks.filter(l=>l.kind==='pair').length+1):`${title(k)} – look ${ST.looks.filter(l=>l.kind===k).length+1}`);
    if(ST.looks.length>=40){toast('Your Lookbook is full. Delete a look to save another.');return;}
    ST.looks.unshift({kind:k,name,at:Date.now(),gown:k!=='suit'?clone(ST.gown):undefined,suit:k!=='gown'?clone(ST.suit):undefined});save();toast('Saved to your Lookbook');if(inp)inp.value='';return;}
  if(d.load!==undefined){const l=ST.looks[+d.load];if(l.gown)ST.gown=sanitize(Object.assign(clone(GOWN_DEFAULT),clone(l.gown)),G_OPTS,GOWN_DEFAULT);if(l.suit)ST.suit=sanitize(Object.assign(clone(SUIT_DEFAULT),clone(l.suit)),S_OPTS,SUIT_DEFAULT);save();toast(`Opened “${l.name}”`);location.hash=l.kind==='pair'?'together':l.kind+'-review';return;}
  if(d.del!==undefined){const i=+d.del;if(DEL===i){ST.looks.splice(i,1);DEL=-1;save();toast('Look deleted');}else{DEL=i;setTimeout(()=>{if(DEL===i){DEL=-1;if(CUR==='lookbook')render(true);}},3500);}render(true);return;}
  if(d.wx!==undefined){wedSave();lookupWeather();return;}
  if(d.reset!==undefined){if(RESET){ST.gown=clone(GOWN_DEFAULT);ST.suit=clone(SUIT_DEFAULT);ST.done={gown:{},suit:{}};ST.last={gown:'',suit:''};RESET=false;save();toast('Designs reset');}else{RESET=true;setTimeout(()=>{RESET=false;},4000);}render(true);return;}
});
function wedSave(){document.querySelectorAll('[data-field]').forEach(i=>{ST.profile[i.dataset.field]=i.value.trim();});save();}
document.addEventListener('change',e=>{if(e.target.matches('[data-field]')){wedSave();if(e.target.dataset.field==='date'||e.target.dataset.field.endsWith('Name'))render(true);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#w-l')){wedSave();lookupWeather();}if(e.key==='Enter'&&e.target.matches('#ob-g,#ob-s,#ob-d,#ob-l')){obSave();OB=Math.min(2,OB+1);render();}});

render();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('/sw.js').catch(()=>{});}catch(e){}

</script>
</body>
</html>
