services:
  - type: web
    name: wedding-wardrobe
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OPEN_METEO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
